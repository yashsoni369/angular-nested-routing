<mat-toolbar color="primary" class="app-toolbar">
  <mat-icon class="toolbar-icon">device_hub</mat-icon>
  <span class="toolbar-brand">Nested Routing</span>
  <span class="toolbar-spacer"></span>
  <a mat-button
     [routerLink]="['/admin']"
     routerLinkActive="active-link"
     matTooltip="Admin Section">
    <mat-icon>admin_panel_settings</mat-icon>
    Admin
  </a>
  <a mat-button
     [routerLink]="['/user']"
     routerLinkActive="active-link"
     matTooltip="User Section">
    <mat-icon>person</mat-icon>
    User
  </a>
</mat-toolbar>

<div class="app-content">
  <h1>Welcome to Nested Routing Tutorial!</h1>
  <h2>Click on a section above to get started</h2>

  <mat-divider></mat-divider>

  <mat-card class="router-card">
    <mat-card-header>
      <mat-icon mat-card-avatar class="card-header-icon">router</mat-icon>
      <mat-card-title>Primary Router Outlet</mat-card-title>
      <mat-card-subtitle>Content loads below based on the active route</mat-card-subtitle>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content class="router-card-content">
      <router-outlet></router-outlet>
    </mat-card-content>
  </mat-card>
</div>
